<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת שיתוף</title>
<style>
  body{font:17px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#EDEDED;color:#1A1A1A}
  h1{font-size:22px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
  td{padding:9px 10px;border-bottom:1px solid #D4D4D4}
  td.r{font-weight:700;text-align:center;width:70px}
  .ok{color:#1b7a2e}.no{color:#B3261E}
  button{display:block;width:100%;font:inherit;font-weight:700;min-height:54px;margin:10px 0;border-radius:10px;border:0;background:#D61B5C;color:#fff}
  #ua,#log{font-size:13px;direction:ltr;text-align:left;word-break:break-all;background:#fff;padding:10px;border-radius:10px}
</style>
</head>
<body>
<h1>בדיקת שיתוף קבצים</h1>
<p>צלמו מסך של כל הדף ושלחו. הדף לא שולח שום מידע לשום מקום.</p>
<table id="t"></table>
<button id="b1">ניסיון שיתוף: CSV לבד</button>
<button id="b2">ניסיון שיתוף: PDF + CSV</button>
<div id="log">-</div>
<p>הדפדפן:</p>
<div id="ua"></div>
<script>
const pdfBytes = "%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF";
const csvBytes = "﻿\"a\",\"b\"\r\n\"1\",\"2\"\r\n";
const pdf = new File([pdfBytes], "בדיקה.pdf", { type: "application/pdf" });
const csv = new File([csvBytes], "בדיקה.csv", { type: "text/csv" });
const cases = [
  ["PDF", [pdf]],
  ["CSV (text/csv)", [csv]],
  ["CSV שם באנגלית", [new File([csvBytes], "test.csv", { type: "text/csv" })]],
  ["CSV (comma-separated-values)", [new File([csvBytes], "בדיקה.csv", { type: "text/comma-separated-values" })]],
  ["TXT", [new File([csvBytes], "בדיקה.txt", { type: "text/plain" })]],
  ["PDF + CSV", [pdf, csv]],
  ["PDF + PDF", [pdf, new File([pdfBytes], "בדיקה2.pdf", { type: "application/pdf" })]],
];
const t = document.getElementById("t");
for (const [name, files] of cases) {
  let r;
  try { r = navigator.canShare ? (navigator.canShare({ files }) ? "כן" : "לא") : "אין"; } catch (e) { r = "שגיאה"; }
  t.insertAdjacentHTML("beforeend", `<tr><td>${name}</td><td class="r ${r === "כן" ? "ok" : "no"}">${r}</td></tr>`);
}
document.getElementById("ua").textContent = navigator.userAgent;
const log = document.getElementById("log");
async function tryShare(label, files) {
  try { await navigator.share({ files }); log.textContent = label + ": OK"; }
  catch (e) { log.textContent = label + ": " + (e && e.name) + " - " + (e && e.message); }
}
document.getElementById("b1").onclick = () => tryShare("CSV", [csv]);
document.getElementById("b2").onclick = () => tryShare("PDF+CSV", [pdf, csv]);
</script>
</body>
</html>
