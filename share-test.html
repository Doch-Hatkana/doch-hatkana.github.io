<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת שיתוף</title>
<style>
  body{font:17px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#EDEDED;color:#1A1A1A}
  h1{font-size:22px;margin:0 0 12px}
  ol{padding-inline-start:22px}
  button{display:block;width:100%;font:inherit;font-weight:700;min-height:54px;margin:10px 0;border-radius:10px;border:0;background:#D61B5C;color:#fff}
  #log{font-size:15px;background:#fff;padding:10px;border-radius:10px;white-space:pre-line}
</style>
</head>
<body>
<h1>בדיקת שיתוף לוואטסאפ</h1>
<ol>
  <li>לוחצים על כפתור 1.</li>
  <li>בוואטסאפ בוחרים את הצ'אט עם עצמכם (או איש קשר שלכם) ושולחים.</li>
  <li>חוזרים לדף הזה וממשיכים לכפתור הבא, עד 5.</li>
  <li>בסוף מצלמים את הצ'אט בוואטסאפ ואת הדף הזה, ושולחים את שתי התמונות.</li>
</ol>
<button data-n="1">1. PDF לבד</button>
<button data-n="2">2. CSV לבד</button>
<button data-n="3">3. PDF + CSV</button>
<button data-n="4">4. PDF + CSV + טקסט</button>
<button data-n="5">5. CSV לבד + טקסט</button>
<div id="log">תוצאות:</div>
<script>
const pdfB64 = "JVBERi0xLjQKMSAwIG9iago8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFI+PgplbmRvYmoKMiAwIG9iago8PC9UeXBlL1BhZ2VzL0tpZHNbMyAwIFJdL0NvdW50IDE+PgplbmRvYmoKMyAwIG9iago8PC9UeXBlL1BhZ2UvUGFyZW50IDIgMCBSL01lZGlhQm94WzAgMCAzMDAgMTUwXS9Db250ZW50cyA0IDAgUi9SZXNvdXJjZXM8PC9Gb250PDwvRjEgNSAwIFI+Pj4+Pj4KZW5kb2JqCjQgMCBvYmoKPDwvTGVuZ3RoIDQ0Pj5zdHJlYW0KQlQgL0YxIDI0IFRmIDQwIDcwIFRkIChTaGFyZSB0ZXN0IFBERikgVGogRVQKZW5kc3RyZWFtCmVuZG9iago1IDAgb2JqCjw8L1R5cGUvRm9udC9TdWJ0eXBlL1R5cGUxL0Jhc2VGb250L0hlbHZldGljYT4+CmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMDkgMDAwMDAgbiAKMDAwMDAwMDA1NCAwMDAwMCBuIAowMDAwMDAwMTA1IDAwMDAwIG4gCjAwMDAwMDAyMTcgMDAwMDAgbiAKMDAwMDAwMDMwOCAwMDAwMCBuIAp0cmFpbGVyPDwvU2l6ZSA2L1Jvb3QgMSAwIFI+PgpzdGFydHhyZWYKMzcxCiUlRU9GCg==";
const pdfBytes = Uint8Array.from(atob(pdfB64), c => c.charCodeAt(0));
const csvBytes = "﻿\"שם\",\"כמות\"\r\n\"בדיקה\",\"1\"\r\n";
const pdf = n => new File([pdfBytes], `בדיקה-${n}.pdf`, { type: "application/pdf" });
const csv = n => new File([csvBytes], `בדיקה-${n}.csv`, { type: "text/csv" });
const text = "בדיקת שיתוף";
const tests = {
  1: () => ({ files: [pdf(1)] }),
  2: () => ({ files: [csv(2)] }),
  3: () => ({ files: [pdf(3), csv(3)] }),
  4: () => ({ files: [pdf(4), csv(4)], text }),
  5: () => ({ files: [csv(5)], text }),
};
const log = document.getElementById("log");
document.querySelectorAll("button").forEach(b => b.onclick = async () => {
  const n = b.dataset.n;
  try { await navigator.share(tests[n]()); log.textContent += `\n${n}: נמסר לשיתוף`; }
  catch (e) { log.textContent += `\n${n}: ${e && e.name}`; }
});
</script>
</body>
</html>
